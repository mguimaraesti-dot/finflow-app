name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finflow_owner:finflow_owner@localhost:5432/finflow_test
      TEST_DATABASE_URL: postgresql://finflow_owner:finflow_owner@localhost:5432/finflow_test
      TEST_DATABASE_URL_APP: postgresql://finflow_api:finflow_api@localhost:5432/finflow_test
      DATABASE_URL_APP: postgresql://finflow_api:finflow_api@localhost:5432/finflow_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Banco de teste (papéis e migrations)
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          SUPERUSER_URL=postgresql://postgres:postgres@localhost:5432/postgres bash scripts/db-setup.sh
          pnpm --filter @finflow/db exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
